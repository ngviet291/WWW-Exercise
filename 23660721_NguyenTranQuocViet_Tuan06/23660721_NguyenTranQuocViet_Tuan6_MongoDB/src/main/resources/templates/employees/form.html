<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Nhân viên')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width: 640px">
    <h3 th:text="${employee.id == null} ? 'Thêm nhân viên' : 'Sửa nhân viên #' + ${employee.id}"></h3>

    <form th:action="@{/employees/save}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Họ tên</label>
            <input class="form-control" th:field="*{name}">
            <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Vai trò</label>
            <input class="form-control" th:field="*{role}">
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Tuổi</label>
                <input type="number" class="form-control" th:field="*{age}">
                <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
            </div>
            <div class="col mb-3">
                <label class="form-label">Lương</label>
                <input type="number" step="any" class="form-control" th:field="*{salary}">
                <div class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Phòng ban</label>
            <select class="form-select" th:field="*{departmentId}">
                <option value="">-- Chọn phòng ban --</option>
                <option th:each="d : ${departments}" th:value="${d.id()}" th:text="${d.name()}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Chức vụ</label>
            <select class="form-select" th:field="*{positionId}">
                <option value="">-- Chọn chức vụ --</option>
                <option th:each="p : ${positions}" th:value="${p.id()}" th:text="${p.title()}"></option>
            </select>
        </div>

        <button class="btn btn-primary">Lưu</button>
        <a class="btn btn-secondary" th:href="@{/employees}">Hủy</a>
    </form>
</div>
</body>
</html>
